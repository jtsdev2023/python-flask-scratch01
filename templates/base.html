<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page_title }} | Jeremy Flix DVD Rental</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body data-page="{{ page_name }}"{% if order_id is defined %} data-order-id="{{ order_id }}"{% endif %}>
    <div class="page-shell">
        <nav class="navbar navbar-expand-lg navbar-dark site-nav">
            <div class="container">
                <a class="navbar-brand brand-mark" href="{{ url_for('home_page') }}">Jeremy Flix DVD Rental</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#siteNav" aria-controls="siteNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="siteNav">
                    <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
                        {% if is_authenticated %}
                            <li class="nav-item"><a class="nav-link {% if page_name == 'catalog' %}active{% endif %}" href="{{ url_for('catalog_page') }}">Catalog</a></li>
                            <li class="nav-item"><a class="nav-link {% if page_name == 'cart' %}active{% endif %}" href="{{ url_for('cart_page') }}">Cart</a></li>
                            <li class="nav-item"><button class="btn btn-outline-light btn-sm ms-lg-2" type="button" data-logout-button>Logout</button></li>
                        {% else %}
                            <li class="nav-item"><a class="nav-link {% if page_name == 'home' %}active{% endif %}" href="{{ url_for('home_page') }}">Home</a></li>
                            <li class="nav-item"><a class="nav-link {% if page_name == 'login' %}active{% endif %}" href="{{ url_for('login_page') }}">Login</a></li>
                            <li class="nav-item"><a class="btn btn-warning btn-sm ms-lg-2" href="{{ url_for('register_page') }}">Register</a></li>
                        {% endif %}

                        <!-- debug start -->
                        <!-- show all navbar icons -->
                        <!-- <li class="nav-item"><a class="nav-link {% if page_name == 'catalog' %}active{% endif %}" href="{{ url_for('catalog_page') }}">Catalog</a></li>
                        <li class="nav-item"><a class="nav-link {% if page_name == 'cart' %}active{% endif %}" href="{{ url_for('cart_page') }}">Cart</a></li>
                        <li class="nav-item"><button class="btn btn-outline-light btn-sm ms-lg-2" type="button" data-logout-button>Logout</button></li>
                        <li class="nav-item"><a class="nav-link {% if page_name == 'home' %}active{% endif %}" href="{{ url_for('home_page') }}">Home</a></li>
                        <li class="nav-item"><a class="nav-link {% if page_name == 'login' %}active{% endif %}" href="{{ url_for('login_page') }}">Login</a></li>
                        <li class="nav-item"><a class="btn btn-warning btn-sm ms-lg-2" href="{{ url_for('register_page') }}">Register</a></li> -->
                        <!-- debug stop -->
                    </ul>
                </div>
            </div>
        </nav>

        <main class="page-main">
            <div class="container py-4 py-lg-5">
                <div id="page-alert" class="alert d-none" role="alert"></div>
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
