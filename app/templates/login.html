{% extends "base.html" %}

{% block content %}
{# login form, submitted via javascript to the login api #}
<div class="row justify-content-center">
    <div class="col-lg-6 col-xl-5">
        <section class="surface-card p-4 p-lg-5">
            <!-- <span class="eyebrow text-dark">Account access</span> -->
            <span class="eyebrow span-login-account-access">Account access</span>
            <h1 class="h2 mt-2 mb-3">Login</h1>
            <p class="text-secondary mb-4">Use the account you created during registration to continue browsing and managing your cart.</p>

            <div id="form-alert" class="alert d-none" role="alert"></div>

            <form id="login-form" novalidate>
                <div class="mb-3 login-form">
                    <label class="form-label" for="email">Email address</label>
                    <input class="form-control form-control-lg" id="email" name="email" type="email" autocomplete="email" required>
                </div>
                <div class="mb-4 login-form">
                    <label class="form-label" for="password">Password</label>
                    <input class="form-control form-control-lg" id="password" name="password" type="password" autocomplete="current-password" required>
                </div>
                <!-- <button class="btn btn-dark btn-lg w-100" type="submit" data-submit-button>Login</button> -->
                <button class="btn btn-warning btn-lg w-100" type="submit" data-submit-button>Login</button>
            </form>

            <p class="text-secondary mt-4 mb-0">Need an account? <a href="{{ url_for('register_page') }}">Create one here</a>.</p>
        </section>
    </div>
</div>
{% endblock %}
